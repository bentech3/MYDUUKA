<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>MYDUUKA — Simple Shop Management for Uganda</title>
  
  <!-- PWA Manifest & Mobile Icons -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1A6B4A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MYDUUKA">
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Design System & Styles -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <!-- Single Page App Shell -->
  <div id="app"></div>

  <!-- App Core JavaScript Files -->
  <script src="js/utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>

  <!-- Screen Modules -->
  <script src="js/screens/auth.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/money.js"></script>
  <script src="js/screens/sell.js"></script>
  <script src="js/screens/products.js"></script>
  <script src="js/screens/stock.js"></script>
  <script src="js/screens/customers.js"></script>
  <script src="js/screens/suppliers.js"></script>
  <script src="js/screens/reports.js"></script>
  <script src="js/screens/monitor.js"></script>
  <script src="js/screens/alerts.js"></script>
  <script src="js/screens/users.js"></script>
  <script src="js/screens/closeday.js"></script>
  <script src="js/screens/settings.js"></script>

  <!-- Main App Controller & Router -->
  <script src="js/app.js"></script>

  <!-- Service Worker Registration for Offline Operation -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('MYDUUKA Service Worker registered for offline access:', reg.scope))
          .catch(err => console.warn('Service Worker registration failed:', err));
      });
    }
  </script>

</body>
</html>
